<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Case IQ overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=JetBrains+Mono:wght@600&family=Source+Serif+4:opsz,wght@8..60,400&display=block">
<style>
  :root {
    --ground: #f2f2f5; --ink: #111111; --body2: #2b2b31; --muted: #4f4f57;
    --received: #e5e5ea; --indigo: #2438a8; --hairline: #d1d1d6;
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    font-optical-sizing: auto; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased;
  }
  #stage > * { position: absolute; }

  /* z-order: scrim < ground (with fine print) < avatar/label/bubbles < end-card items < quote card */
  #scrim { z-index: 1; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0; }
  #ground { z-index: 2; left: 0; top: 0; width: 1080px; height: 1920px; background: var(--ground); will-change: transform; }
  #fine { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 500; font-size: 36px; line-height: 1.25;
    color: var(--muted); font-variation-settings: 'wdth' 100; white-space: nowrap; }

  #avatar, #sender, .bub { z-index: 3; }
  #avatar { left: 72px; width: 110px; height: 110px; }
  #avatar .anim { width: 110px; height: 110px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 20px rgba(0,0,0,.06); opacity: 0; }
  #avatar svg { width: 56px; height: auto; display: block; }
  #sender { font-weight: 600; font-size: 36px; line-height: 1.2; color: #d6d6dc; white-space: nowrap; opacity: 0; }

  .bub { transform-origin: 0 100%; opacity: 0;
    /* flat card shadow (brand "Card"), scaled: 0 3px 6px .08, 0 22px 55px .06 (drop-shadow blur = box blur / 2) */
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.08)) drop-shadow(0 22px 27.5px rgba(0,0,0,.06)); }
  .bub .body {
    box-sizing: border-box; width: fit-content; max-width: 768px;
    background: var(--received); color: var(--ink);
    font-weight: 800; font-size: 72px; line-height: 1.0; letter-spacing: -0.02em;
    font-variation-settings: 'wdth' 78;
    padding: 26px 40px; border-radius: 62px;
  }
  .bub svg.tail { position: absolute; left: 0; top: 100%; width: 1px; height: 1px; overflow: visible; z-index: -1; }
  .bub svg.tail path { fill: var(--received); }

  .row { z-index: 4; left: 0; width: 1080px; display: flex; justify-content: center; }
  .row > .anim { display: flex; align-items: center; opacity: 0; }

  #wordmark .anim { gap: 18px; }
  #wordmark svg { height: 76px; width: auto; display: block; }
  #wordmark .name { font-weight: 800; font-size: 104px; line-height: 76px; letter-spacing: 0;
    font-variation-settings: 'wdth' 78; color: var(--ink); white-space: nowrap; }

  #pill .anim { height: 104px; box-sizing: border-box; border-radius: 999px; background: var(--indigo);
    padding: 0 14px 0 48px; gap: 32px; box-shadow: 0 12px 27px rgba(36,56,168,.35); }
  #pill .lab { font-weight: 700; font-size: 50px; line-height: 1; color: #fff; white-space: nowrap; }
  #pill .circ { width: 76px; height: 76px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; }
  #pill .circ svg { width: 76px; height: 76px; display: block; }

  .row > .anim.blk { display: block; }
  #price .anim { font-weight: 600; font-size: 50px; line-height: 1.15; color: var(--body2); white-space: nowrap; text-align: center; }

  /* the lifted quote card: the one lifted thing */
  #card { z-index: 6; left: 90px; width: 900px; box-sizing: border-box; background: #fff; border-radius: 50px;
    padding: 34px 38px 36px; opacity: 0; transform-origin: 50% 50%;
    box-shadow: 0 6px 11px rgba(0,0,0,.12), 0 44px 83px rgba(0,0,0,.20); }
  #card .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px 16px; }
  #card .lbl { font-weight: 600; font-size: 36px; line-height: 1.2; color: var(--muted); }
  #card .ex { font-weight: 600; font-size: 36px; line-height: 1.2; color: var(--muted); border: 2px solid var(--hairline);
    border-radius: 999px; padding: 4px 16px; }
  #card .src { margin-top: 14px; font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-weight: 600; font-size: 36px;
    line-height: 1.3; color: var(--muted); white-space: nowrap; font-feature-settings: 'tnum' 1, 'lnum' 1; }
  #card .quote { margin-top: 18px; background: #f1f4f8; border-left: 8px solid #7c8aa0; padding: 24px 32px;
    font-family: "Source Serif 4", Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1.3; color: var(--ink); }
</style>
</head>
<body>
<div id="stage">
  <svg id="scrim" viewBox="0 0 1080 1920" width="1080" height="1920">
    <defs>
      <filter id="feather" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
      <mask id="hole" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
        <rect x="0" y="0" width="1080" height="1920" fill="#fff"/>
        <rect id="holeRect" x="376" y="1012" width="327" height="82" fill="#000" filter="url(#feather)"/>
      </mask>
    </defs>
    <rect x="0" y="0" width="1080" height="1920" fill="#111" mask="url(#hole)"/>
  </svg>

  <div id="ground"><div id="fine"><div>Case IQ isn’t a law firm and doesn’t give legal advice.</div></div></div>

  <div id="avatar"><div class="anim">
    <svg viewBox="0 0 30 26"><path d="M6 1h18a5 5 0 0 1 5 5v9a5 5 0 0 1-5 5H13l-7 5v-5a5 5 0 0 1-5-5V6a5 5 0 0 1 5-5z" fill="#111"/><path d="M8 8h14M8 13h9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
  </div></div>
  <div id="sender">Case IQ</div>

  <div class="bub" id="b1"><div class="body">You know what happened.</div>
    <svg class="tail" viewBox="0 0 1 1"><path d="M0 -72 L0 -54 C0 -24 -9 -8 -26 1 C-12 -4 8 0 32 0 L78 0 L78 -30 Z"/></svg></div>
  <div class="bub" id="b2"><div class="body">Let’s find the page<br>that shows it.</div>
    <svg class="tail" viewBox="0 0 1 1"><path d="M0 -72 L0 -54 C0 -24 -9 -8 -26 1 C-12 -4 8 0 32 0 L78 0 L78 -30 Z"/></svg></div>

  <div class="row" id="wordmark"><div class="anim">
    <svg viewBox="0 0 30 26"><path d="M6 1h18a5 5 0 0 1 5 5v9a5 5 0 0 1-5 5H13l-7 5v-5a5 5 0 0 1-5-5V6a5 5 0 0 1 5-5z" fill="#111"/><path d="M8 8h14M8 13h9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="name">Case IQ</span></div></div>

  <div class="row" id="price"><div class="anim blk">Flat price, never hourly.</div></div>

  <div class="row" id="pill"><div class="anim">
    <span class="lab">Get my case in order</span>
    <span class="circ"><svg viewBox="0 0 100 100"><path d="M30 50H69M52 31L70 50L52 69" fill="none" stroke="#2438a8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div></div>

  <div id="card">
    <div class="top"><span class="lbl">Your papers show</span><span class="ex">Example, not a real case</span></div>
    <div class="src">Email · 12 Jan 2025 · page 1</div>
    <div class="quote">“Your role is not affected by the restructuring.”</div>
  </div>
</div>

<script>
/* ---------- deterministic overlay: everything is a pure function of t ---------- */
const CFG = window.__CFG || {
  t: { bubble1: -0.15, bubble2: 3.15, card: 5.625, endCard: 7.1, wordmark: 7.25, price: 7.4, pill: 7.5 },
  payoff: { pageRect: { x: 376, y: 1012, w: 327, h: 82 }, scrimAlpha: 0.35, scrimFade: 0.2 },
};
const T = CFG.t, PO = CFG.payoff;
const $ = (id) => document.getElementById(id);
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const r3 = (x) => Math.round(x * 1000) / 1000;

/* closed-form damped spring, x(0)=0 -> 1, v(0)=0 */
function spring(t, k, c, m = 1) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
  if (z < 1) {
    const wd = w0 * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
  }
  if (z === 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  const s = w0 * Math.sqrt(z * z - 1), a = -z * w0 + s, b = -z * w0 - s;
  return 1 - (b * Math.exp(a * t) - a * Math.exp(b * t)) / (b - a);
}
/* cubic-bezier(x1,y1,x2,y2) easing, solved by bisection */
function cubicBezier(x1, y1, x2, y2) {
  const bx = (u) => 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u;
  const by = (u) => 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let lo = 0, hi = 1;
    for (let i = 0; i < 48; i++) { const mid = (lo + hi) / 2; (bx(mid) < x) ? (lo = mid) : (hi = mid); }
    return by((lo + hi) / 2);
  };
}
const ease = cubicBezier(0.22, 1, 0.36, 1);
const lerp = (a, b, p) => a + (b - a) * p;
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

/* geometry (filled in by layout()) */
const G = { av1: 0, av2: 0, card: { cx: 0, cy: 0 } };

function enter(el, t0, t, extra = '') {            /* bubble-style entrance: spring 480/24, 24px up, 0.94 scale */
  const tau = t - t0;
  if (tau < 0) { el.style.opacity = 0; el.style.visibility = 'hidden'; return; }
  const x = spring(tau, 480, 24, 1);
  el.style.visibility = 'visible';
  el.style.opacity = r3(clamp01(tau / 0.12));
  el.style.transform = `${extra}translateY(${r3(24 * (1 - x))}px) scale(${r3(0.94 + 0.06 * x)})`;
}
function rise(el, t0, t, dur = 0.26, px = 20) {
  const p = ease(clamp01((t - t0) / dur));
  el.style.opacity = r3(p);
  el.style.transform = `translateY(${r3((1 - p) * px)}px)`;
}

function renderAt(t) {
  /* conversation */
  enter($('b1'), T.bubble1, t);
  enter($('b2'), T.bubble2, t);
  enter(document.querySelector('#avatar .anim'), T.bubble1, t);
  enter($('sender'), T.bubble1, t);
  /* the avatar glides down to bubble 2's bottom on the same spring */
  $('avatar').style.top = r3(G.av1 + (G.av2 - G.av1) * spring(t - T.bubble2, 480, 24, 1)) + 'px';

  /* scrim: #111 at 35%, 200 ms fade, hole (feathered) around the touched page */
  $('scrim').style.opacity = r3(PO.scrimAlpha * clamp01((t - T.card) / PO.scrimFade));

  /* quote card springs out of the touched page */
  const card = $('card'), tau = t - T.card;
  if (tau < 0) { card.style.opacity = 0; card.style.visibility = 'hidden'; }
  else {
    const x = ease(clamp01(tau / 0.28)), p = PO.pageRect;   /* eased 0.28 s move, no overshoot */
    const dx = (p.x + p.w / 2 - G.card.cx) * (1 - x), dy = (p.y + p.h / 2 - G.card.cy) * (1 - x);
    card.style.visibility = 'visible';
    card.style.opacity = r3(clamp01(tau / 0.08));
    card.style.transform = `translate(${r3(dx)}px, ${r3(dy)}px) rotate(${r3(-1.4 * x)}deg) scale(${r3(0.55 + 0.45 * x)})`;
  }

  /* end card: ground rises (fine print rides on it); label eases to the ground-friendly grey */
  const gp = ease(clamp01((t - T.endCard) / 0.26));
  $('ground').style.transform = `translateY(${r3((1 - gp) * 1920)}px)`;
  const a = hex('#d6d6dc'), b = hex('#4f4f57');
  $('sender').style.color = `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], gp))).join(',')})`;

  rise(document.querySelector('#wordmark .anim'), T.wordmark, t, 0.26, 16);
  rise(document.querySelector('#price .anim'), T.price, t, 0.26, 20);
  const pill = document.querySelector('#pill .anim'), pt = t - T.pill;
  if (pt < 0) pill.style.opacity = 0;
  else {
    const x = spring(pt, 480, 24, 1);
    pill.style.opacity = r3(clamp01(pt / 0.12));
    pill.style.transform = `scale(${r3(0.92 + 0.08 * x)})`;
  }
}

/* ---------- one-time static layout ---------- */
const GAP = 34;
function layout() {
  const AVL = 72, AV = 110, CLEAR = 14, TAIL = 26;
  const BL = AVL + AV + CLEAR + TAIL;             /* bubble left edge: tail tip sits 14 px from the avatar */
  const b1 = $('b1'), b2 = $('b2'), sender = $('sender');
  const top1 = 262;
  b1.style.left = BL + 'px'; b2.style.left = BL + 'px';
  b1.style.top = top1 + 'px';
  b2.style.top = (top1 + b1.offsetHeight + 20) + 'px';
  sender.style.left = (BL + 30) + 'px';
  sender.style.top = (top1 - sender.offsetHeight - 8) + 'px';
  const b1bot = top1 + b1.offsetHeight, b2bot = parseFloat(b2.style.top) + b2.offsetHeight;
  G.av1 = b1bot - AV; G.av2 = b2bot - AV;
  $('avatar').style.top = G.av1 + 'px';

  /* quote card rest: centred, top 26 px below bubble 2; its bottom must stay at or above y 1000 (drop the quote to 40 px before anything else) */
  const card = $('card');
  const cardTop = b2bot + 26;
  card.style.top = cardTop + 'px';
  window.__quoteShrunk = false;
  if (cardTop + card.offsetHeight + 6 > 1000) { card.querySelector('.quote').style.fontSize = '40px'; window.__quoteShrunk = true; }
  const cardBottom = cardTop + card.offsetHeight;
  G.card = { cx: 90 + 450, cy: cardTop + card.offsetHeight / 2 };

  /* end-card stack below the card (8 px allowance for the -1.4deg tilt): wordmark has >= 45 px clear above and below */
  const wm = $('wordmark'), price = $('price'), pill = $('pill'), fine = $('fine');
  const wmTop = cardBottom + 8 + 45;  wm.style.top = wmTop + 'px';
  const wmBot = wmTop + wm.offsetHeight;
  const priceTop = wmBot + 45;        price.style.top = priceTop + 'px';
  const priceBot = priceTop + price.offsetHeight;
  const pillTop = priceBot + 30;      pill.style.top = pillTop + 'px';
  const pillBot = pillTop + pill.offsetHeight;
  const fineTop = pillBot + 28;       fine.style.top = fineTop + 'px';
  const fineBot = fineTop + fine.offsetHeight;
  window.__stack = { cardTop, cardBottom, wmTop, wmBot, priceTop, priceBot, pillTop, pillBot, fineTop, fineBot, lastBaseline: +(fineBot - 0.2 * 36).toFixed(1), quoteShrunk: window.__quoteShrunk };

  /* scrim hole */
  const h = $('holeRect'), p = PO.pageRect;
  h.setAttribute('x', p.x); h.setAttribute('y', p.y); h.setAttribute('width', p.w); h.setAttribute('height', p.h);
}

window.renderAt = renderAt;
window.layoutInfo = () => {
  const q = (s) => { const r = document.querySelector(s).getBoundingClientRect(); return { x: +r.x.toFixed(1), y: +r.y.toFixed(1), w: +r.width.toFixed(1), h: +r.height.toFixed(1) }; };
  return {
    stack: window.__stack, G,
    b1: q('#b1 .body'), b2: q('#b2 .body'), sender: q('#sender'), card: q('#card'), src: q('#card .src'), srcFont: getComputedStyle(document.querySelector('#card .src')).fontSize,
    quote: q('#card .quote'), name: q('#wordmark .name'), glyph: q('#wordmark svg'), pill: q('#pill .anim'), lab: q('#pill .lab'),
    price: q('#price .anim'), fine1: q('#fine div:nth-child(1)'), cardTop: q('#card .top'), ex: q('#card .ex'), lbl: q('#card .lbl'),
  };
};
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([
    document.fonts.load("800 72px 'Bricolage Grotesque'"), document.fonts.load("600 36px 'Bricolage Grotesque'"),
    document.fonts.load("500 36px 'Bricolage Grotesque'"), document.fonts.load("700 50px 'Bricolage Grotesque'"),
    document.fonts.load("600 30px 'JetBrains Mono'"), document.fonts.load("400 44px 'Source Serif 4'"),
  ]);
  await document.fonts.ready;
  layout();
  renderAt(+(new URLSearchParams(location.search).get('t') || 0));
  return true;
})();
</script>
</body>
</html>
